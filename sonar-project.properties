# ── Project Identity ────────────────────────────────────────────────────────
sonar.projectKey=blockchain-service
sonar.projectName=Blockchain Service
sonar.projectVersion=1.0

sonar.sources=app
sonar.language=py
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
    **/__pycache__/**, \
    **/*.pyc, \
    **/*.pyo, \
    **/migrations/**, \
    **/alembic/versions/**, \
    **/.venv/**, \
    **/venv/**, \
    **/.git/**, \
    **/dist/**, \
    **/*.egg-info/**

sonar.python.version=3.11
